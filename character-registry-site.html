function shrinkImg(f){
  return new Promise(function(res){
    if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<1500000){res(f);return}
    var u=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      try{var m=2200,r=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
        c.toBlob(function(b){res(b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f)},'image/jpeg',0.86)}
      catch(e){res(f)}};
    im.onerror=function(){URL.revokeObjectURL(u);res(f)};im.src=u;
  });
}
async function addFiles(files){
  files=files.filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|gif|webp|heic|heif|avif)$/i.test(f.name||'')});
  if(!files.length){showErr('Choose image files (JPG, PNG, WebP or HEIC).');return}
  if(!assets){showErr('Image upload is not available right now. Reload the page and try again.');return}
  for(var i=0;i<files.length;i++){
    try{toast('Uploading '+(i+1)+' of '+files.length+'…');var f=await shrinkImg(files[i]);var r=await assets.upload(f);syncAll();draft.images.push(r.id);draft.captions.push('');$('#thumbs').innerHTML=thumbs()}
    catch(err){showErr('Could not upload '+(files[i].name||'image')+(err&&err.code==='too_large'?' (file too large).':(err&&err.message?' ('+err.message+').':'.')))}
  }
}

  var p={name:name,alt:val('k-alt'),malay:val('k-malay'),type:$('#k-type').value,mainClass:$('#k-main').value,category:$('#k-cat').value,element:val('k-el'),rank:$('#k-rank').value,range:val('k-range'),cost:val('k-cost'),
    description:$('#k-desc').value.trim(),usage:$('#k-use').value.trim(),requirements:$('#k-req').value.trim(),trivia:$('#k-tri').value.trim(),updatedAt:Date.now()};
  var cdv=$('#k-cd').value.trim(),cdu=$('#k-cdu').value,cdm=CDU.find(function(x){return x[0]===cdu})[2];
  if(cdv!==''&&(isNaN(+cdv)||+cdv<0)){showErr('Cooldown must be a number of 0 or more.');return}
  p.cooldownSec=cdv===''?null:Math.round(+cdv*cdm*1000)/1000;p.cooldownUnit=cdu;
  syncAll();p.native=val('k-native');p.classification=clsList(val('k-class')).join(', ');p.debut=val('k-debut');p.parent=$('#k-parent').value;p.tags=val('k-tags');
  p.related=skillDraft.related.filter(function(x,i,a){return x&&a.indexOf(x)===i});p.extras=cleanEx(skillDraft.extras);
  var id=skillDraftId;
  if(!id){id=slug(name)||('k'+Date.now().toString(36));if(skills.some(function(s){return s.id===id}))id=id+'-'+Date.now().toString(36).slice(-4)}
  document.querySelectorAll('[data-ed=save]').forEach(function(b){b.disabled=true});
  try{await db.collection('skills').doc(id).set(p);learnSkill(p);closeEditor();toast('Skill saved');location.hash='skill-'+id}
  catch(e){document.querySelectorAll('[data-ed=save]').forEach(function(b){b.disabled=false});showErr('Could not save: '+((e&&e.message)||'try again in a moment.'))}
}

function readPlaces(){

  for(var n=0;n<nats.length;n++){var nation=nats[n].querySelector('.pn-name').value.trim(),nms=nats[n].querySelector('.pn-ms').value.trim(),rows=nats[n].querySelectorAll('.plrow');

function useCount(k,v){

  if(k==='skillTypes')return skills.filter(function(s){return eq(s.type)}).length;
  if(k==='mainClasses')return skills.filter(function(s){return eq(s.mainClass)}).length;
  if(k==='abilityTypes'){chars.forEach(function(c){(c.abilities||[]).forEach(function(a){if(eq(a.type))n++})});return n}
  if(k==='masteryLevels'){chars.forEach(function(c){(c.skills||[]).forEach(function(l){if(eq(l.level))n++})});return n}

  if(k==='classifications')return skills.filter(function(s){return clsList(s.classification).some(eq)}).length+chars.filter(function(c){return clsList(c.classification).some(eq)}).length;

function renameUsage(k,oldV,newV){
  var lc=String(oldV).toLowerCase(),eq=function(x){return String(x||'').toLowerCase()===lc},w=[];
  var fm={affiliations:'affiliation',teams:'team',clans:'clan',species:'species',bloodTypes:'blood',occupations:'occupation',statuses:'status',affinities:'affinity'};
  var sm={natures:'element',skillTypes:'type',mainClasses:'mainClass',skillClasses:'category'};
  var clone=function(o){var c=JSON.parse(JSON.stringify(o));delete c.id;return c};
  var ch=function(col,o,fn){var c=clone(o);if(fn(c)){w.push([col,o.id,c])}};
  var swapCls=function(c){var a=clsList(c.classification),ch2=false;a=a.map(function(x){if(eq(x)){ch2=true;return newV}return x});if(ch2)c.classification=a.join(', ');return ch2};
  chars.forEach(function(o){
    if(fm[k])ch('characters',o,function(c){if(eq(c[fm[k]])){c[fm[k]]=newV;return true}return false});
    else if(k==='abilityTypes')ch('characters',o,function(c){var f=false;(c.abilities||[]).forEach(function(a){if(eq(a.type)){a.type=newV;f=true}});return f});
    else if(k==='masteryLevels')ch('characters',o,function(c){var f=false;(c.skills||[]).forEach(function(a){if(eq(a.level)){a.level=newV;f=true}});return f});
    else if(k==='classifications')ch('characters',o,swapCls);
  });
  skills.forEach(function(o){
    if(sm[k])ch('skills',o,function(c){if(eq(c[sm[k]])){c[sm[k]]=newV;return true}return false});
    else if(k==='classifications')ch('skills',o,swapCls);
  });

var GUIDE=[["start", "Getting started", "The Character Registry is a database of story characters and the skills they know. The bar at the top of every page has five parts:\n\n- **Registry** is the homepage. It lists every character as a card.\n- **Skills** is the skill archive, with a page for each technique.\n- **Lists & Settings** holds the pick lists used by the editors, display settings and backup tools.\n- **Locations** lists every nation and place, with the characters affiliated with or born in each.\n- **Guide** is this page.\n\nEveryone who can open the page can read it. Only the owner and people with edit access see the editing buttons (New character, New skill, Edit, Customize site). Changes save straight to the shared database, so there is no publish step."], ["registry", "The Registry homepage", "Each card shows a portrait, a rank stamp, the name, the affiliation and the registration number. A character without an image shows their initials.\n\n- Search matches the name, affiliation and registration number. Press `/` to jump to the search box.\n- Filter by affiliation, by rank (F to S), or sort by name, rank, overall stats or most recently edited.\n- Your filters and sort are remembered in your browser. Settings can choose the default sort for visitors who have not picked one.\n- Editors also see **New character** and **Export backup**."], ["character", "A character page", "A page opens with a short lead sentence, then a **Contents** box that jumps to each section. The infobox sits on the right on a computer and at the top on a phone.\n\n## The infobox\n\n- Name, alias, native name and the rank stamp.\n- The image carousel: use the arrows, the dots, the left and right arrow keys, or swipe on a phone. Click an image to enlarge it.\n- Grouped data sections. Click a section header to collapse or expand it.\n- The registration number has a **Copy** button.\n- Statistics as bars from 1.0 to 10.0, with the overall average.\n\n## The page\n\n- Background, Profile, Personality, Appearance, Abilities, Skills and Mission Experience, followed by Quotes and Trivia when they have content.\n- Category chips at the bottom link back to the registry. Previous and Next buttons move to neighbouring files.\n- **Copy link** copies the address of the page."], ["editor", "Editing a character", "Editors open the editor with **Edit file** (or the pencil on the infobox). **New character** is on the homepage.\n\nThe editor is split into sections:\n\n- **Title**: name, alias and native name.\n- **Images**: add pictures, drag files onto the form, reorder with the arrows. The first image is the cover.\n- **Personal data**, **Registry data** and **Combat data**: the fields shown in the infobox.\n- **Tags** and **Extra infobox sections**: your own labelled rows.\n- **Statistics** from 1.0 to 10.0 and **Missions completed** for ranks F to S.\n- **Abilities** and **Skills** (see below).\n- **Page content**: Background, Profile, Personality, Appearance, Quotes and Trivia.\n\nAt the bottom: **Save**, **Cancel**, **Duplicate** and **Delete** (Delete asks you to confirm). Press `Ctrl+S` or `Cmd+S` to save and `Esc` to close. A registration number reads `MMDD-L0000-GG`, for example `0625-S0017-17`: born 25 June, birthplace code S, character number 0017 and a gender code (odd for male, even for female, picked at random). Fill in **Birthdate**, **Birthplace**, **Gender** and the 4-digit **Character number** (you choose it and it must be unique). The number then fills itself in, or press **Generate reg. no.**. **Re-roll code** picks a new gender code. Birthplace and Affiliation stay in step: picking a Birthplace fills in the nation as the Affiliation when it is empty, and choosing a nation as the Affiliation narrows the Birthplace list. A tag shows when the number matches the character's record.\n\nNew affiliations, species, teams and similar values you type are added to the pick lists automatically."], ["abilities", "Abilities and skills", "**Abilities** belong to one character. Use them for innate traits and passive powers. Each ability has a name, a type and a description.\n\n**Skills** are shared techniques kept in the skill archive. In the character editor, add a skill and pick how well the character knows it (Learning, Proficient, Mastery or Signature by default). The character page shows a table of their skills, and each skill page lists everyone who knows it."], ["skills", "The skill archive", "The **Skills** page lists every technique. Search it, filter by type, nature, class or optional classification, sort by name, rank or most users, or click a rank chip.\n\nSkills follow one categorisation scheme:\n\n- **Type**: Art or Ability.\n- **Nature**: the element of the technique, such as Ice Style or Fire Style.\n- **Main classification**: Bloodline or General.\n- **Optional classification**: any number of tags, such as Barrier, Sealing or Space-Time. Shown as chips in the infobox. Click one to filter the archive.\n- **Class**: Offensive, Defensive or Supplementary.\n- **Rank**: D, C, B, A, S, SS, SSS or SSS+.\n- A name, an English alternate name, a native name and a **Nama (Bahasa Melayu)**.\n- **Range**, **Cost** and **Debut**. **Cooldown** is a time: choose a number and a unit (seconds, minutes, hours or days). Zero shows as None.\n- **Derived from** (parent) and **Related skills**, which link skill pages together. Derived skills appear on the parent's page.\n- Tags, extra infobox sections, and the Description, Usage, Requirements and Trivia text.\n\nThe choices for Type, Class, Main classification, Optional classification and Nature are lists you can change under **Lists & Settings**."], ["markdown", "Markdown and wiki links", "All page-content fields, the descriptions of abilities and skills, and the infobox values accept Markdown:\n\n- `**bold**`, `*italic*` and `~~strikethrough~~`.\n- `# Heading`, `- bullet`, `1. numbered` and `> quote` at the start of a line.\n- `[text](https://example.com)` for a link that opens in a new tab, and `[text](#skills)` for a link inside the registry.\n- `[[Frost Edge]]` links to the character or skill with that name. Capital letters do not matter, and a skill's alternate name works too. `[[Frost Edge|the Edge]]` shows your own text.\n- A wiki link to a page that does not exist shows with a dotted underline. Settings can turn that off.\n\nRaw HTML is not allowed."], ["lists", "Lists & Settings", "The **Lists & Settings** page keeps the choices that the editors suggest: affiliations, teams, clans, species, blood types, occupations, statuses, ability types, mastery levels, skill types, skill classes, main classifications, optional classifications, natures and character affinities. The small number on a value shows how many entries use it.\n\n- Type a value and press `Enter` (or **Add**) to add it. Click **×** to remove it. **Reset** returns a list to its starting values.\n- Removing a value does not change entries that already use it.\n- Values you type into an editor field are added to the matching list when you save.\n\nVisitors can read the lists. Editors also get **Settings**:\n\n- **Statistic labels** rename Intelligence, Strength, Speed, Stamina and Combat.\n- **Places and nations**: the places grouped by nation (Negara), each with its Bahasa Melayu name and a one-letter code used in registration numbers. Every place is a choice for Birthplace and Affiliation. Use **+ Add place** inside a nation, or **+ Add nation**, then **Save places**.\n- **Default registry sort** for visitors who have not chosen one.\n- Whether wiki links to missing pages show as plain text.\n\nClick a section title to collapse it, or use **Expand all** and **Collapse all**."], ["site", "Customizing the site", "**Customize site** (editors only) changes the text and the look:\n\n- **Text**: site name, hero kicker, hero title, tagline and footer note.\n- **Design**: five presets (Shonen Ink, Neon Rift, Ember Blade, Sakura Strike and Clean Dossier), the main and highlight colours, the headline font, card size, hero style, halftone background, shadow depth and corner radius.\n\nChanges preview live. Press **Save site** to keep them, or close the panel to go back. **Reset design** returns to Shonen Ink. Characters and skills are not affected."], ["backup", "Backup and reset", "Editors find these tools under **Lists & Settings → Backup and reset**.\n\n- **Export everything (JSON)** saves every character and skill, the site design, the lists and the settings. Your browser may ask you to confirm the download.\n- **Import JSON backup** restores a backup file. Entries with the same ID are replaced, and everything else is kept.\n- **Download site (HTML)** saves the whole site as one file with the design, lists, characters, skills and images built in. It opens offline in any browser and is read-only.\n- **Load sample entries** adds two sample characters and six sample skills. **Remove sample entries** deletes only the entries tagged Sample.\n- **Clear data** deletes all characters, all skills, or both. Type `CLEAR` to confirm. Lists, settings and the site design are kept.\n\nDeleting cannot be undone, so export a backup first."], ["tips", "Tips and shortcuts", "- `/` focuses the search box on the homepage.\n- `Ctrl+S` or `Cmd+S` saves the open editor. `Esc` closes an editor or an enlarged image.\n- The left and right arrow keys flip through a character's images.\n- On a phone the editor fills the screen, with Save and Close always in view.\n- Use **Duplicate** in the editor to start a new character from an existing one.\n- Entries tagged **Sample** came with the page. Remove them under Backup and reset when you are ready to start with your own. You can load them again from the same place."]];

  var p={name:name,gender:val('e-gender'),age:val('e-age'),birthdate:val('e-birth'),affiliation:val('e-aff'),rank:$('#e-rank').value,regNo:val('e-reg'),birthplace:($('#e-bplace')||{}).value||'',
    background:$('#e-bg').value.trim(),profile:$('#e-pro').value.trim(),personality:$('#e-per').value.trim(),appearance:$('#e-app').value.trim(),
    stats:{},missions:{},images:draft.images.slice(),updatedAt:Date.now()};
  syncAll();var T=function(id){return val(id)};
  p.alias=T('e-alias');p.native=T('e-native');p.status=$('#e-status').value;p.species=T('e-species');p.height=T('e-height');p.weight=T('e-weight');p.blood=T('e-blood');p.occupation=T('e-occ');
  p.team=T('e-team');p.partner=T('e-partner');p.clan=T('e-clan');p.debut=T('e-debut');p.classification=T('e-class');p.affinity=T('e-affin');p.equipment=T('e-equip');p.tags=T('e-tags');
  p.quotes=$('#e-quo').value.trim();p.trivia=$('#e-tri').value.trim();p.captions=draft.captions.slice(0,draft.images.length);p.extras=cleanEx(draft.extras);
  p.abilities=draft.abilities.filter(function(a){return a.name});p.skills=draft.skills.filter(function(x){return x.id});
  STATS.forEach(function(s){p.stats[s[0]]=num($('#s-'+s[0]).value,1,10,true)});
  RANKS.forEach(function(r){p.missions[r]=num($('#m-'+r).value,0,1e6,false)});
  var clash=p.regNo&&chars.find(function(c){return c.regNo===p.regNo&&c.id!==draftId});
  if(clash){showErr('Registration number '+p.regNo+' already belongs to '+clash.name+'.');return}
  var pn=regParse(p.regNo),clash2=pn&&chars.find(function(c){var q=regParse(c.regNo);return q&&q.num===pn.num&&c.id!==draftId});
  if(clash2){showErr('Character number '+pn.num+' already belongs to '+clash2.name+'.');return}
  var id=draftId;
  if(!id){
    id=slug(name)||('c'+Date.now().toString(36));
    if(chars.some(function(c){return c.id===id}))id=id+'-'+Date.now().toString(36).slice(-4);
  }
  document.querySelectorAll('[data-ed=save]').forEach(function(b){b.disabled=true});
  try{await db.collection('characters').doc(id).set(p);learnChar(p);closeEditor();toast('Saved');location.hash='char-'+id}
  catch(e){document.querySelectorAll('[data-ed=save]').forEach(function(b){b.disabled=false});showErr('Could not save: '+((e&&e.message)||'try again in a moment.'))}
}
async function del(btn){
  if(!armed){armed=true;btn.textContent='Confirm delete';return}
  btn.disabled=true;
  try{await (skillDraft?db.collection('skills').doc(skillDraftId):db.collection('characters').doc(draftId)).delete();var back=skillDraft?'skills':'home';closeEditor();toast('Deleted');location.hash=back}
  catch(e){btn.disabled=false;showErr('Could not delete: '+((e&&e.message)||'try again in a moment.'))}
}

/* ---- combobox: inputs with a suggestion list show every option from the arrow ---- */
var cbMenu=null,cbInp=null,cbIdx=-1,cbAt=0,cbAll=false;
function cbOpts(inp){if(inp.tagName==='SELECT')return Array.prototype.map.call(inp.options,function(o){return {v:o.value,t:o.textContent}});var dl=document.getElementById(inp.dataset.cb);return dl?Array.prototype.map.call(dl.options,function(o){return {v:o.value,t:o.value}}):[]}
function cbClose(){if(cbMenu){cbMenu.remove();cbMenu=null;cbInp=null;cbIdx=-1}}
function cbOpen(inp,all){cbAll=!!all;
  cbClose();var q=all?'':inp.value.trim().toLowerCase(),cur=inp.value.trim().toLowerCase(),isSel=inp.tagName==='SELECT';
  var o=cbOpts(inp).filter(function(x){return !q||x.t.toLowerCase().indexOf(q)>=0});if(!o.length)return;var fm=-1;
  var m=document.createElement('div');m.className='cbmenu';m.setAttribute('role','listbox');
  m.innerHTML=o.map(function(x){return '<button type="button" role="option" tabindex="-1" data-cbv="'+esc(x.v)+'"'+(x.v.toLowerCase()===cur?' aria-selected="true"':'')+'>'+esc(x.t||'—')+'</button>'}).join('');
  var r=inp.getBoundingClientRect(),vh=window.innerHeight,below=vh-r.bottom;
  m.style.left=Math.max(4,r.left)+'px';m.style.minWidth=r.width+'px';m.style.maxWidth=(window.innerWidth-8)+'px';
  if(below<200&&r.top>below){m.style.bottom=(vh-r.top)+'px';m.style.maxHeight=Math.min(320,r.top-8)+'px'}else{m.style.top=r.bottom+'px';m.style.maxHeight=Math.min(320,below-8)+'px'}
  document.body.appendChild(m);cbMenu=m;cbInp=inp;cbIdx=-1;cbAt=Date.now();
  if(fm>=0){var bs=m.querySelectorAll('button');if(bs[fm]){bs[fm].classList.add('on');cbIdx=fm}}var sel=m.querySelector('.on')||m.querySelector('[aria-selected=true]');if(sel)sel.scrollIntoView({block:'nearest'});
}
function cbPick(v){var inp=cbInp;if(!inp)return;inp.value=v;cbClose();inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}))}
function cbMove(d){if(!cbMenu)return;var b=cbMenu.querySelectorAll('button');if(!b.length)return;cbIdx=(cbIdx+d+b.length)%b.length;b.forEach(function(x,i){x.classList.toggle('on',i===cbIdx)});b[cbIdx].scrollIntoView({block:'nearest'})}
document.addEventListener('pointerdown',function(e){
  var t=e.target;
  if(t.closest&&t.closest('.cbmenu'))return;
  var btn=t.closest&&t.closest('.cbbtn');
  if(btn){e.preventDefault();var inp=btn.parentNode.querySelector('input');if(cbMenu&&cbInp===inp&&cbAll){cbClose()}else{cbOpen(inp,true)}return}
  if(t.dataset&&t.dataset.cb){if(!(cbMenu&&cbInp===t&&cbAll))cbOpen(t,true);return}
  var ss=document.querySelectorAll('select'),hit=null;
  for(var si=0;si<ss.length;si++){var sx=ss[si];if(sx.multiple||sx.disabled)continue;var rr=sx.getBoundingClientRect();if(e.clientX>=rr.left&&e.clientX<=rr.right&&e.clientY>=rr.top&&e.clientY<=rr.bottom&&(t===sx||t.contains(sx)||sx.parentNode.contains(t))){hit=sx;break}}
  if(hit){e.preventDefault();hit.focus();if(cbMenu&&cbInp===hit)cbClose();else cbOpen(hit,true);return}
  cbClose();
});
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.cbmenu button');if(b){e.preventDefault();cbPick(b.dataset.cbv)}});
document.addEventListener('input',function(e){var t=e.target;if(e.isTrusted&&t.dataset&&t.dataset.cb)cbOpen(t,false)});
document.addEventListener('keydown',function(e){var t=e.target;if(t&&t.tagName==='SELECT'&&!t.multiple&&(e.key===' '||e.key==='Enter'||(e.key==='ArrowDown'&&e.altKey))&&!cbMenu){e.preventDefault();cbOpen(t,true);return}if(t&&t.tagName==='SELECT'&&cbMenu&&cbInp===t){if(e.key==='ArrowDown'){e.preventDefault();cbMove(1);return}if(e.key==='ArrowUp'){e.preventDefault();cbMove(-1);return}if(e.key==='Enter'&&cbIdx>=0){e.preventDefault();var bb=cbMenu.querySelectorAll('button')[cbIdx];if(bb)cbPick(bb.dataset.cbv);return}if(e.key==='Escape'){e.preventDefault();cbClose();return}}if(!(t.dataset&&t.dataset.cb))return;
  if(e.key==='ArrowDown'){e.preventDefault();if(!cbMenu)cbOpen(t,true);cbMove(1)}
  else if(e.key==='ArrowUp'&&cbMenu){e.preventDefault();cbMove(-1)}
  else if(e.key==='Enter'&&cbMenu&&cbIdx>=0){e.preventDefault();e.stopPropagation();var b=cbMenu.querySelectorAll('button')[cbIdx];if(b)cbPick(b.dataset.cbv)}
  else if(e.key==='Escape'&&cbMenu){e.preventDefault();e.stopPropagation();cbClose()}
  else if(e.key==='Tab')cbClose()},true);

/* combo boxes: replace native datalist popups so the arrow and focus always show every value */
var comboEl=null,comboInp=null,comboIdx=-1,comboQuiet=false;
function comboOpts(inp){var dl=inp.dataset.list&&document.getElementById(inp.dataset.list);return dl?Array.prototype.map.call(dl.options,function(o){return o.value}):[]}

  var on=comboEl.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});
}
function comboPick(v){var inp=comboInp;comboClose();if(inp){comboQuiet=true;inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}));comboQuiet=false}}
function comboMark(){if(!comboEl)return;var a=comboEl.querySelectorAll('.co');a.forEach(function(x,i){x.classList.toggle('act',i===comboIdx)});if(a[comboIdx])a[comboIdx].scrollIntoView({block:'nearest'})}
document.addEventListener('focusin',function(e){var t=e.target;if(t&&t.tagName==='INPUT'){if(t.hasAttribute('list')){t.dataset.list=t.getAttribute('list');t.removeAttribute('list')}if(t.dataset.list)comboOpen(t,'')}});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!$('#lightbox').hidden){closeLb();return}if(editing()){closeEditor();return}}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&editing()){e.preventDefault();var sb=document.querySelector('[data-ed=save]');if(sb)sb.click();return}
  if(e.key==='/'&&!editing()&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'')){var qi=$('#q');if(qi){e.preventDefault();qi.focus()}return}
  if(!e.target.closest||!e.target.closest('.car'))return;
  var c=chars.find(function(x){return x.id===route()});if(!c||!c.images||c.images.length<2)return;
  if(e.key==='ArrowLeft'){slide=(slide-1+c.images.length)%c.images.length;render();var el=$('.car');el&&el.focus()}
  if(e.key==='ArrowRight'){slide=(slide+1)%c.images.length;render();var el2=$('.car');el2&&el2.focus()}
});
document.addEventListener('toggle',function(e){var d=e.target;if(d&&d.dataset&&d.dataset.dk)lopen[d.dataset.dk]=d.open},true);
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('l-add')){e.preventDefault();addListValue(e.target.dataset.lk)}});
window.addEventListener('hashchange',function(){window.scrollTo(0,0);render()});

var tx=null;
document.addEventListener('touchstart',function(e){tx=(e.target.closest&&e.target.closest('.car'))?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<45)return;
  var c=chars.find(function(x){return x.id===route()});if(!c||!c.images||c.images.length<2)return;slide=(slide+(dx<0?1:-1)+c.images.length)%c.images.length;render()},{passive:true});
document.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='IMG'&&t.closest('.frame,.pic,.thumb')){t.hidden=true;t.parentNode.classList.add('broken')}},true);
var edEl=$('#editor');
edEl.addEventListener('dragover',function(e){if(draft&&assets){e.preventDefault();edEl.classList.add('drag')}});
edEl.addEventListener('dragleave',function(e){if(e.target===edEl)edEl.classList.remove('drag')});
edEl.addEventListener('drop',function(e){e.preventDefault();edEl.classList.remove('drag');if(draft&&assets)addFiles(Array.prototype.slice.call(e.dataTransfer.files))});

function startLive(){
  db.collection('skills').onSnapshot(function(sn){
    skills=sn.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});skillsReady=true;
    if(document.activeElement&&document.activeElement.id==='skq')updateSkillGrid();else render();
  },function(){skillsReady=true;render()});
  db.doc('site/config').onSnapshot(function(sn){
    var d=sn.exists?sn.data():{};cfg={lists:Object.assign({},d.lists||{}),settings:Object.assign({},d.settings||{})};applyCfg();
    if(Date.now()-lastLw<2000&&isListsPage())return;
    var a=document.activeElement;if(isListsPage()&&a&&a.closest&&a.closest('#app')&&/INPUT|SELECT/.test(a.tagName))return;
    render();
  },function(){});
  db.doc('site/main').onSnapshot(function(sn){
    if(siteDraft)return;
    site=mergeSite(sn.exists?sn.data():null);try{localStorage.setItem('reg-site',JSON.stringify(site))}catch(e){}
    applyTheme(site.theme);render();
  },function(){});
  timer=setTimeout(function(){if(status==='loading'){status='slow';render()}},10000);
  db.collection('characters').onSnapshot(function(s){
    clearTimeout(timer);
    chars=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}).sort(function(a,b){return String(a.name).localeCompare(String(b.name))});
    status='ready';
    if(!document.activeElement||document.activeElement.id!=='q')render();else updateGrid();
  },function(){clearTimeout(timer);status='error';render()});
}
/* ---------- boot ---------- */
render();
(async function(){
  if(window.__SNAP){var S0=window.__SNAP;chars=S0.characters||[];skills=S0.skills||[];skillsReady=true;cfg={lists:(S0.config||{}).lists||{},settings:(S0.config||{}).settings||{}};applyCfg();site=mergeSite(S0.site);applyTheme(site.theme);status='ready';canEdit=false;render();var tk=ghTokGet(),gc=ghCfg();if(tk&&gc.repo){try{await ghSignIn(tk,gc,gc.remember,true)}catch(e){if(/did not accept/.test(e.message))ghTokSet('',false)}}return}
  var cl=window.claude;
  try{db=cl&&await cl.use('db')}catch(e){db=null}
  if(!db){status='unavailable';render();return}
  try{var u=await cl.use('user');isAdmin=canEdit=!!(u&&u.canEdit&&await u.canEdit());try{if(isAdmin&&localStorage.getItem('reg-pub')==='1'){pubMode=true;canEdit=false}}catch(e2){}}catch(e){}
  try{assets=await cl.use('assets')}catch(e){assets=null}
  startLive();
})();
})();
</script></body></html>
